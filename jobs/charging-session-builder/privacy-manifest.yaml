# Privacy manifest for charging-session-builder. telemetry-parity check E4 compares inputs, outputs,
# state_stores and sensitive_fields with what it observes; the other keys document the job.
# Topic names are the harness names (rust.<topic>, rust.<job>.state.<store>). In production the
# output is charging.sessions.v1 and the state topic is <STATE_TOPIC_PREFIX>.sessions.
inputs: [vehicle.charging.events.v1]
outputs: [rust.charging.sessions.v1]
state_stores: [rust.charging-session-builder.state.sessions]
sensitive_fields:
  rust.charging.sessions.v1: [session_id, vin, charger_lat, charger_lon]
  rust.charging-session-builder.state.sessions: [vin, charger_lat, charger_lon]

fields_read:
  vehicle.charging.events.v1:
    event_id: none
    vin: vehicle-id
    event_time: none
    event_type: none
    producer_seq: none
    fleet: none
    market: none
    connector_type: none
    charger_type: none
    power_kw: none
    energy_added_kwh: none
    soc_pct: none
    charger_lat: precise-location
    charger_lon: precise-location
fields_written:
  charging.sessions.v1:
    session_id: vehicle-id
    vin: vehicle-id
    fleet: none
    market: none
    connector_type: none
    charger_type: none
    start_time: none
    end_time: none
    close_reason: none
    energy_added_kwh: none
    peak_power_kw: none
    start_soc_pct: none
    end_soc_pct: none
    event_count: none
    charger_lat: precise-location
    charger_lon: precise-location
state:
  sessions:
    topic: <STATE_TOPIC_PREFIX>.sessions
    cleanup_policy: compact
    key: '"vin" as a JSON string'
    value_fields: [vin, pending (event_id, event_time_ms, event_type, producer_seq, fleet, market, connector_type, charger_type, power_kw, energy_added_kwh, soc_pct, charger_lat, charger_lon), max_seen_ms, emitted_until_ms]
    sensitive_fields: [vin, charger_lat, charger_lon]
    retention: none; one record per vin, kept until compaction replaces it. Pending events (with their charger coordinates) leave the value once their session is emitted or they expire as stray events
    legacy: the Spark job held the same per-VIN state, including pending events with charger_lat and charger_lon, in its checkpoint directory (flatMapGroupsWithState state store), not in Kafka
transformations:
  vin: copied unchanged into the output value, the output key and the state topic key and value; never logged
  session_id: UUIDv5 (namespace f5179d15-0fd7-5b5f-bf53-0852eb22d3d5) over vin + "|" + lowercase(charge_start event_id), as Ids.sessionId; never logged
  charger_lat: copied unchanged (no rounding) from the session's charge_start event into the output and from each event into state; never logged
  charger_lon: copied unchanged (no rounding) from the session's charge_start event into the output and from each event into state; never logged
