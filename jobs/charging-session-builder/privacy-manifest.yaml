# Privacy manifest for charging-session-builder. telemetry-parity check E4 compares inputs, outputs,
# state_stores and sensitive_fields with what it observes; the other keys document the job.
# Topic names are the harness names (rust.<topic>, rust.<job>.state.<store>). In production the
# output is charging.sessions.v1 and the state topics are <STATE_TOPIC_PREFIX>.<store>.
inputs: [vehicle.charging.events.v1]
outputs: [rust.charging.sessions.v1]
state_stores:
  - rust.charging-session-builder.state.batch
  - rust.charging-session-builder.state.sessions
  - rust.charging-session-builder.state.watermark
sensitive_fields:
  rust.charging.sessions.v1: [charger_lat, charger_lon, session_id, vin]
  rust.charging-session-builder.state.batch: [charger_lat, charger_lon, vin]
  rust.charging-session-builder.state.sessions: [charger_lat, charger_lon, vin]
  rust.charging-session-builder.state.watermark: []

fields_read:
  vehicle.charging.events.v1:
    event_id: none
    vin: vehicle-id
    event_time: none
    event_type: none
    producer_seq: none
    fleet: none
    market: none
    connector_type: none
    charger_type: none
    power_kw: none
    energy_added_kwh: none
    soc_pct: none
    charger_lat: precise-location
    charger_lon: precise-location
fields_written:
  charging.sessions.v1:
    session_id: vehicle-id
    vin: vehicle-id
    fleet: none
    market: none
    connector_type: none
    charger_type: none
    start_time: none
    end_time: none
    close_reason: none
    energy_added_kwh: none
    peak_power_kw: none
    start_soc_pct: none
    end_soc_pct: none
    event_count: none
    charger_lat: precise-location
    charger_lon: precise-location
state:
  batch:
    topic: <STATE_TOPIC_PREFIX>.batch
    cleanup_policy: compact
    key: '"vin|slot" as a JSON string (slot 0, 1, ... in arrival order within the batch)'
    value_fields: [vin, event (event_id, vin, event_time_ms, event_type, producer_seq, fleet, market, connector_type, charger_type, power_kw, energy_added_kwh, soc_pct, charger_lat, charger_lon, or null)]
    sensitive_fields: [vin, charger_lat, charger_lon]
    retention: a slot holds an input event only while its batch is open; the batch end overwrites it with {vin, event: null} (no tombstone), so charger_lat and charger_lon leave the latest value; slots are reused, at most the VIN's largest batch
    legacy: the rows of the running Spark micro-batch, in Spark's shuffle and Kafka source, not in Kafka
  sessions:
    topic: <STATE_TOPIC_PREFIX>.sessions
    cleanup_policy: compact
    key: 'vin as a JSON string'
    value_fields: [vin, pending (events with the batch value fields), max_seen_ms, emitted_until_ms, timeout_ms]
    sensitive_fields: [vin, charger_lat, charger_lon]
    retention: one record per VIN, never deleted (the legacy job never removes state); pending events, and their charger_lat and charger_lon, leave the value once their session is emitted or they fall more than 30 minutes behind
    legacy: the same SessionState per VIN in the Spark checkpoint directory (flatMapGroupsWithState state store), not in Kafka
  watermark:
    topic: <STATE_TOPIC_PREFIX>.watermark
    cleanup_policy: compact
    key: '"watermark" as a JSON string'
    value_fields: [current_ms, batch_max_ms]
    sensitive_fields: []
    retention: one record, replaced every batch
    legacy: the watermark in the Spark checkpoint offset log
transformations:
  vin: copied unchanged into the output value, the output key and the state values; part of the session_id input and of the state keys; never logged
  session_id: UUIDv5(namespace f5179d15-0fd7-5b5f-bf53-0852eb22d3d5, vin + "|" + lowercase charge_start event_id), as Ids.sessionId
  charger_lat: copied unchanged (full input precision, 5 decimals) from the session's charge_start; no rounding or coarsening (the job does not call GeoUtils.coarsen); never logged
  charger_lon: copied unchanged (full input precision, 5 decimals) from the session's charge_start; no rounding or coarsening (the job does not call GeoUtils.coarsen); never logged
