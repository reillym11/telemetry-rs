# Required per job (see values/<job>.yaml).
job: ""
image:
  repository: ghcr.io/reillym11/telemetry-rs
  tag: ""
  pullPolicy: IfNotPresent

kafka:
  bootstrap: kafka:9092
inputTopics: ""
outputTopic: ""
# Parquet jobs set outputPath (s3a://bucket/prefix) instead of outputTopic.
outputPath: ""
s3:
  # S3_ENDPOINT, for a non-AWS object store.
  endpoint: ""
  # Secret with AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY; empty uses the pod's AWS identity.
  credentialsSecret: ""
consumerGroup: ""
# TRANSACTIONAL_ID and GROUP_INSTANCE_ID are <transactionalIdPrefix>-<pod name>, stable across restarts.
transactionalIdPrefix: ""
stateTopicPrefix: ""

batch:
  maxRecords: 500
  maxMs: 200
txnTimeoutMs: 60000
logLevel: info
metricsPort: 9090
extraEnv: []

# A transactional.id must belong to one live process at a time, so the job runs one pod per id.
replicas: 1
terminationGracePeriodSeconds: 30

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi

podDisruptionBudget:
  enabled: true
  # With one replica, minAvailable: 1 would block every node drain. maxUnavailable: 1 allows the
  # drain; the restarted pod restores state from its changelog topic.
  maxUnavailable: 1

serviceMonitor:
  enabled: false
  interval: 30s
  labels: {}
