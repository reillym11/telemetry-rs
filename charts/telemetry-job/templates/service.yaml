apiVersion: v1
kind: Service
metadata:
  name: {{ include "telemetry-job.name" . }}
  labels: {{- include "telemetry-job.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector: {{- include "telemetry-job.selector" . | nindent 4 }}
  ports:
    - name: metrics
      port: {{ .Values.metricsPort }}
      targetPort: metrics
