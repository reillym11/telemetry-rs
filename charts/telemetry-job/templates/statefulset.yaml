apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "telemetry-job.name" . }}
  labels: {{- include "telemetry-job.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  serviceName: {{ include "telemetry-job.name" . }}
  podManagementPolicy: OrderedReady
  selector:
    matchLabels: {{- include "telemetry-job.selector" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "telemetry-job.selector" . | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: job
          image: "{{ .Values.image.repository }}:{{ required "image.tag is required" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: KAFKA_BOOTSTRAP
              value: {{ .Values.kafka.bootstrap | quote }}
            - name: INPUT_TOPICS
              value: {{ required "inputTopics is required" .Values.inputTopics | quote }}
            {{- if .Values.outputPath }}
            - name: OUTPUT_PATH
              value: {{ .Values.outputPath | quote }}
            {{- with .Values.s3.endpoint }}
            - name: S3_ENDPOINT
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.s3.credentialsSecret }}
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: AWS_SECRET_ACCESS_KEY
            {{- end }}
            {{- else }}
            - name: OUTPUT_TOPIC
              value: {{ required "outputTopic or outputPath is required" .Values.outputTopic | quote }}
            {{- end }}
            - name: CONSUMER_GROUP
              value: {{ required "consumerGroup is required" .Values.consumerGroup | quote }}
            - name: TRANSACTIONAL_ID
              value: "{{ required "transactionalIdPrefix is required" .Values.transactionalIdPrefix }}-$(POD_NAME)"
            - name: GROUP_INSTANCE_ID
              value: "{{ .Values.transactionalIdPrefix }}-$(POD_NAME)"
            - name: STATE_TOPIC_PREFIX
              value: {{ required "stateTopicPrefix is required" .Values.stateTopicPrefix | quote }}
            - name: EXIT_WHEN_CAUGHT_UP
              value: "false"
            - name: BATCH_MAX_RECORDS
              value: {{ .Values.batch.maxRecords | quote }}
            - name: BATCH_MAX_MS
              value: {{ .Values.batch.maxMs | quote }}
            - name: TXN_TIMEOUT_MS
              value: {{ .Values.txnTimeoutMs | quote }}
            - name: METRICS_PORT
              value: {{ .Values.metricsPort | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: metrics
              containerPort: {{ .Values.metricsPort }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            periodSeconds: 5
          startupProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 2
            failureThreshold: 30
          resources: {{- toYaml .Values.resources | nindent 12 }}
