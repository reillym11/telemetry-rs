stages:
  - build
  - test
  - lint
  - parity

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"

variables:
  JOB: ota-status-tracker
  RUST_BUILD_IMAGE: rust:1.98.1-slim-bookworm
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
  IMAGE: "$CI_REGISTRY_IMAGE/$JOB:$CI_COMMIT_SHORT_SHA"
  # Same image with BATCH_MAX_RECORDS=5, so the 43-record sample spans several transactions and chaos can kill mid-run.
  CHAOS_IMAGE: "$CI_REGISTRY_IMAGE/$JOB:$CI_COMMIT_SHORT_SHA-chaos"

.rust:
  image: $RUST_BUILD_IMAGE
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends cmake g++ make >/dev/null
  cache:
    key: cargo-$CI_COMMIT_REF_SLUG
    paths: [.cargo/registry, target/]

.dind:
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""

cargo-build:
  extends: .rust
  stage: build
  script:
    - cargo build --release --locked

docker-image:
  extends: .dind
  stage: build
  image: docker:27
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build --build-arg JOB=$JOB -t "$IMAGE" .
    - printf 'FROM %s\nENV BATCH_MAX_RECORDS=5\n' "$IMAGE" | docker build -t "$CHAOS_IMAGE" -
    - docker push "$IMAGE"
    - docker push "$CHAOS_IMAGE"

cargo-test:
  extends: .rust
  stage: test
  script:
    - cargo test --locked

helm:
  stage: test
  image:
    name: alpine/helm:3.22.0
    entrypoint: [""]
  script:
    - helm lint charts/telemetry-job -f charts/telemetry-job/values/$JOB.yaml
    - helm template $JOB charts/telemetry-job -f charts/telemetry-job/values/$JOB.yaml --set serviceMonitor.enabled=true

fmt:
  extends: .rust
  stage: lint
  before_script: []
  script:
    - cargo fmt --check

clippy:
  extends: .rust
  stage: lint
  script:
    - cargo clippy --locked --all-targets -- -D warnings

audit:
  extends: .rust
  stage: lint
  before_script: []
  script:
    - cargo install cargo-audit --version 0.22.2 --locked
    - cargo audit

parity:
  extends: .dind
  stage: parity
  image: python:3.11
  timeout: 1h
  variables:
    # The harness publishes Kafka and MinIO on the dind host; see telemetry-parity/.gitlab-ci.yml.
    KAFKA_EXTERNAL_HOST: docker
    KAFKA_PUBLISH: "9094"
    MINIO_PUBLISH: "9000"
  before_script:
    - curl -fsSL https://download.docker.com/linux/static/stable/x86_64/docker-27.5.1.tgz | tar xz -C /usr/local/bin --strip-components=1 docker/docker
    - mkdir -p /usr/local/lib/docker/cli-plugins
    - curl -fsSL -o /usr/local/lib/docker/cli-plugins/docker-compose https://github.com/docker/compose/releases/download/v2.32.4/docker-compose-linux-x86_64
    - chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
    - source contracts/SOURCE
    - git clone -q "https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/congition-demo-group/telemetry-parity.git" parity
    - git -C parity checkout -q "$TELEMETRY_PARITY_SHA"
    # Record this commit in the parity report (deps.lock leaves TELEMETRY_RS_SHA for the caller).
    - sed -i "s/^TELEMETRY_RS_SHA=.*/TELEMETRY_RS_SHA=$CI_COMMIT_SHA/" parity/deps.lock
    - pip install -q -r parity/requirements.txt
    - parity/scripts/fetch-deps.sh
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - source parity/deps.lock && export SPARK_RUNNER_IMAGE="$CI_REGISTRY/congition-demo-group/telemetry-parity/spark-runner:${TELEMETRY_SPARK_JOBS_SHA:0:12}"
    - docker pull "$SPARK_RUNNER_IMAGE" || unset SPARK_RUNNER_IMAGE
  script:
    - cd parity
    - RUST_IMAGE="$CHAOS_IMAGE" ./run.sh --job $JOB --fixture sample --chaos --manifest "$CI_PROJECT_DIR/jobs/$JOB/privacy-manifest.yaml"
    - RUST_IMAGE="$IMAGE" ./run.sh --job $JOB --fixture edge --manifest "$CI_PROJECT_DIR/jobs/$JOB/privacy-manifest.yaml"
  after_script:
    - mv parity/runs runs || true
    - for f in runs/*/harness-error.txt; do [ -f "$f" ] && { cat "$f"; tail -n 40 "$(dirname "$f")/rust-job.log"; }; done; true
  artifacts:
    when: always
    expire_in: 90 days
    expose_as: "Parity report"
    paths:
      - runs/
